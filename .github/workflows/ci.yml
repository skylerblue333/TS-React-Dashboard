name: dashboard-metrics-ci

on:
  push:
    branches: [main, "product/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript build
        run: pnpm run build
      - name: Tests
        run: pnpm exec jest --runInBand
      - name: Runtime dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Build image
        run: docker build -t sky-dashboard-metrics:ci .
      - name: Verify non-root image
        run: |
          user="$(docker image inspect sky-dashboard-metrics:ci --format '{{.Config.User}}')"
          test -n "$user"
          test "$user" != "0"
          test "$user" != "root"
      - name: Smoke test liveness
        run: |
          docker run -d --rm --name sky-dashboard-metrics-ci -p 13001:3000 sky-dashboard-metrics:ci
          trap 'docker stop sky-dashboard-metrics-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:13001/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs sky-dashboard-metrics-ci
          exit 1
